title: Small talk con un colega
description: Te encuentras con un colega de otro equipo en la cocina de la oficina.
partner_role: Jordan, a friendly coworker from another team
user_role: an employee taking a coffee break
context: The office kitchen during a coffee break. The two coworkers know each other a little.
openers:
  - "Oh hey! Coffee break too? How's your week going so far?"
  - "Hey, good to see you! I feel like we never run into each other. How have you been?"
  - "Hi! Ugh, I really needed this coffee. How's everything on your team?"
goals:
  - Responde y pregunta cómo está tu colega
  - Habla de tu fin de semana o tus planes
  - Haz una pregunta para seguir la conversación
  - Despídete de forma natural
key_phrases:
  - "How about you?"
  - "Any plans for the weekend?"
  - "That sounds great"
  - "I'd better get back to work"
  - "Catch you later"

guided:
  turns:
    - buddy: "Hey, how's it going? I haven't seen you in a while."
      you: "Hey, I'm doing well, thanks. It's been a busy week. How about you?"
      es: "Hola, estoy bien, gracias. Ha sido una semana ocupada. ¿Y tú?"
    - buddy: "Same here, too many meetings. Any plans for the weekend?"
      you: "Not really. I'm going to visit my parents on Saturday. What about you?"
      es: "La verdad, no. Voy a visitar a mis padres el sábado. ¿Y tú?"
    - buddy: "I'm going hiking if the weather is nice."
      you: "That sounds great. Do you go hiking often?"
      es: "Suena genial. ¿Vas de excursión a menudo?"
    - buddy: "Maybe once a month. It helps me relax. How's your project going, by the way?"
      you: "It's going well, but the deadline is really tight."
      es: "Va bien, pero la fecha límite está muy justa."
    - buddy: "Oh, I know the feeling. Good luck with it!"
      you: "Thanks. Well, I'd better get back to work."
      es: "Gracias. Bueno, será mejor que vuelva al trabajo."
    - buddy: "Me too. See you around!"
      you: "Catch you later. Have a good weekend!"
      es: "Nos vemos luego. ¡Que tengas buen fin de semana!"
  closing: "You too!"
