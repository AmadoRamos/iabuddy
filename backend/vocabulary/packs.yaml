# Paquetes de palabras de la Misión: uno por título de tema (tabla topics) o id de escenario (backend/scenarios).
# term: la palabra o expresión · es: qué significa · ex: una frase de ejemplo que la usa
# forms: formas irregulares, para detectarla al hablar (las regulares -s, -ed, -ing no hace falta ponerlas).
# Se ofrecen en este orden y las que ya pasaron por tu banco no se repiten.

General:
  - {term: figure out, es: "averiguar, resolver", ex: "I need to figure out how this works.", forms: [figure it out, figure that out]}
  - {term: to be honest, es: "la verdad, siendo sincero", ex: "To be honest, I didn't like the movie."}
  - {term: struggle with, es: "tener dificultades con", ex: "I still struggle with phrasal verbs."}
  - {term: look forward to, es: "tener ganas de, esperar con ilusión", ex: "I'm looking forward to the weekend."}
  - {term: it depends on, es: "depende de", ex: "It depends on the weather."}
  - {term: get used to, es: "acostumbrarse a", ex: "I'm getting used to working from home.", forms: [getting used to, got used to, gotten used to]}
  - {term: end up, es: "acabar, terminar (sin planearlo)", ex: "We ended up staying until midnight."}
  - {term: run out of, es: "quedarse sin", ex: "We ran out of time.", forms: [ran out of]}
  - {term: make sense, es: "tener sentido", ex: "That doesn't make sense to me.", forms: [made sense]}
  - {term: worth it, es: "valer la pena", ex: "The trip was long, but it was worth it."}
  - {term: on the other hand, es: "por otro lado", ex: "On the other hand, it's very expensive."}
  - {term: come up with, es: "idear, ocurrírsele a uno", ex: "She came up with a great idea.", forms: [came up with]}

