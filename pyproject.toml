[project]
name = "iabuddy"
version = "0.1.0"
description = "Compañero local de conversación en inglés con feedback de gramática y pronunciación."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.1.post1",
    "ruff",
]
spikes = [
    "kokoro-onnx>=0.6.1",
    "onnx-asr[cpu,hub]>=0.12.0",
    "sounddevice>=0.5.6",
    "torch>=2.15.0",
    "transformers>=5.21.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
