[project]
name = "iabuddy"
version = "0.1.0"
description = "Compañero local de conversación en inglés con feedback de gramática y pronunciación."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]
spikes = [
    "kokoro-onnx>=0.6.1",
    "onnx-asr[cpu,hub]>=0.12.0",
    "sounddevice>=0.5.6",
    "torch>=2.15.0",
    "transformers>=5.21.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
